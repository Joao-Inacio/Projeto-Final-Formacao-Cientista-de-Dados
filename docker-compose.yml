version: '3.8'

services:
  db:
    image: postgres:16
    container_name: meu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 851428
      POSTGRES_DB: db_creditos
    ports:
    - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
